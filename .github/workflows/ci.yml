name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/up >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "app never became ready"
          docker compose logs app
          exit 1

      - name: Create test database
        run: |
          docker compose exec -T postgres psql -U conditiongame -d postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname='conditiongame_test'" | grep -q 1 \
            || docker compose exec -T postgres createdb -U conditiongame conditiongame_test
          docker compose exec -T postgres psql -U conditiongame -d conditiongame_test -c \
            "CREATE EXTENSION IF NOT EXISTS vector" >/dev/null

      - name: Quality gates
        run: docker compose exec -T app ./scripts/check.sh

      - name: Smoke test
        run: docker compose exec -T app php scripts/smoke.php

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Shut down
        if: always()
        run: docker compose down -v

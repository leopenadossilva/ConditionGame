services:
  app:
    build:
      context: .
    container_name: conditiongame_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ConditionGame
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: conditiongame
      DB_USERNAME: conditiongame
      DB_PASSWORD: conditiongame
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-https://api.openai.com/v1}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: conditiongame_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: conditiongame
      POSTGRES_USER: conditiongame
      POSTGRES_PASSWORD: conditiongame
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conditiongame -d conditiongame"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:

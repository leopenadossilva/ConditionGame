version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: conditiongame_postgres
    environment:
      POSTGRES_DB: conditiongame
      POSTGRES_USER: conditiongame
      POSTGRES_PASSWORD: conditiongame
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conditiongame -d conditiongame"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conditiongame_backend
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: conditiongame
      DB_USERNAME: conditiongame
      DB_PASSWORD: conditiongame

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conditiongame_frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pg_data:

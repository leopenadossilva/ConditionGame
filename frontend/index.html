<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConditionGame - v1</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ConditionGame v1</h1>
        </header>
        <main>
            <section class="game-area" id="gameArea">
                <div class="scene" id="scene">
                    <p>Game scene placeholder</p>
                </div>
            </section>
            <section class="agent-panel">
                <div class="agent-avatar">
                    <div class="avatar-circle">🤖</div>
                    <div class="avatar-name">Helper</div>
                </div>
                <div class="smart-chat" id="smartChat">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input">
                        <input type="text" id="chatInput" placeholder="Ask the helper...">
                        <button id="chatSend">Send</button>
                    </div>
                </div>
                <div class="agent-tools">
                    <h3>Agent Tools</h3>
                    <button id="btnEnemiesGet">enemies_get</button>
                </div>
            </section>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
